<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Browse and open ACC plant engineering documents from Google Drive." />
    <meta name="robots" content="noindex, nofollow" />

    <link rel="manifest" href="%BASE_URL%manifest.json" />
    <meta name="theme-color" content="#084a82" />
    <link rel="icon" href="%BASE_URL%icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MyFLS Docs" />

    <title>MyFLS &mdash; Document Browser</title>

    <script>
      // Applied before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("myfls_theme");
          if (t) document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("%BASE_URL%sw.js"));
      }
    </script>
  </body>
</html>
