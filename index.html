<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RAMLIYA CEMENT PLANT &mdash; Documents</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">RAMLIYA CEMENT PLANT <span>Document Browser</span></div>
    <div class="search">
      <input id="searchBox" type="search" placeholder="Search document no. or title..." autocomplete="off" />
    </div>
    <div class="auth">
      <span id="authStatus" class="auth-status"></span>
      <button id="signInBtn" class="btn">Sign in with Google</button>
      <button id="signOutBtn" class="btn secondary" hidden>Sign out</button>
    </div>
  </header>

  <main class="layout">
    <aside class="tree-panel">
      <div class="panel-title">
        Complete project
        <select id="viewSelect" class="view-select">
          <option value="1">Process view</option>
          <option value="2">Discipline view</option>
        </select>
      </div>
      <ul id="tree" class="tree"></ul>
    </aside>

    <section class="doc-panel">
      <div class="breadcrumb" id="breadcrumb"></div>

      <div class="toolbar">
        <label class="levels-toggle">
          <input type="checkbox" id="showAllLevels" checked />
          Show all levels
        </label>
        <span id="docCount" class="doc-count"></span>
        <div class="pager">
          <button id="prevPage" class="btn small">&lsaquo;</button>
          <span id="pageLabel"></span>
          <button id="nextPage" class="btn small">&rsaquo;</button>
        </div>
      </div>

      <div class="table-wrap">
        <table id="docTable">
          <thead>
            <tr>
              <th data-sort="docNo">Document No.</th>
              <th data-sort="version">Version</th>
              <th data-sort="eqpNo">Eqp. No.</th>
              <th data-sort="title">Title</th>
              <th data-sort="docType">Document type</th>
              <th data-sort="status">Status</th>
              <th data-sort="publishDate">Publish date</th>
            </tr>
          </thead>
          <tbody id="docTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
