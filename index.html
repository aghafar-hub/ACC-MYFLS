<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyFLS &mdash; Document Browser</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="acc-logo.png" alt="Arabian Cement Company" class="brand-logo acc-logo" onerror="this.hidden=true" />
      <img src="fls-logo.png" alt="FLSmidth" class="brand-logo fls-logo" />
      <span class="brand-text">Document Browser</span>
    </div>
    <div class="search">
      <input id="searchBox" type="search" placeholder="Search..." autocomplete="off" />
    </div>
    <div class="auth">
      <span id="authStatus" class="auth-status"></span>
    </div>
  </header>

  <main class="layout">
    <aside class="tree-panel">
      <div class="panel-title">
        <span id="treePanelTitle">Plants &amp; Projects</span>
        <select id="viewSelect" class="view-select" hidden>
          <option value="1">Process view</option>
          <option value="2">Discipline view</option>
        </select>
      </div>
      <ul id="tree" class="tree"></ul>
    </aside>

    <section class="doc-panel">
      <div class="breadcrumb" id="breadcrumb"></div>

      <div class="toolbar">
        <label class="levels-toggle" id="showAllLevelsWrap">
          <input type="checkbox" id="showAllLevels" checked />
          Show all levels
        </label>
        <span id="docCount" class="doc-count"></span>
        <div class="pager">
          <button id="prevPage" class="btn small">&lsaquo;</button>
          <span id="pageLabel"></span>
          <button id="nextPage" class="btn small">&rsaquo;</button>
        </div>
      </div>

      <div class="table-wrap">
        <table id="docTable">
          <thead id="docTableHead"></thead>
          <tbody id="docTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
